[package]
name = "ruzstd"
version = "0.9.2-alpha.1"
rust-version = "1.87"
authors = ["Moritz Borcherding <moritz.borcherding@web.de>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/KillingSpark/zstd-rs"
description = "A decoder for the zstd compression format"
exclude = ["decodecorpus_files/*", "dict_tests/*", "fuzz_decodecorpus/*"]
readme = "Readme.md"
keywords = ["zstd", "zstandard", "decompression"]
categories = ["compression"]

[dependencies]
# Locked behind the `hash` feature flag
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"], optional = true }
fastrand = { version = "2.5", optional = true }

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
zstd = "0.14"

[features]
default = ["hash", "std"]
dict_builder = ["std", "dep:fastrand"]
hash = ["dep:twox-hash"]
fuzz_exports = []
std = []

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
rustc-dep-of-std = ["dep:core", "dep:alloc"]

[[bench]]
name = "decode_all"
harness = false
