on: [push, pull_request]

name: CI

jobs:
  tests:
      name: stable lint, test, build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout sources
          uses: actions/checkout@v4

        - name: Install stable toolchain
          uses: dtolnay/rust-toolchain@stable
          with:
            components: clippy
        - name: Install cargo-hack
          uses: taiki-e/install-action@v2
          with:
            tool: cargo-hack
        - name: check
          run: cargo +stable hack check --workspace --feature-powerset --exclude-features rustc-dep-of-std
        - name: cargo hack clippy
          run: cargo +stable hack clippy --workspace --feature-powerset --exclude-features rustc-dep-of-std
        - name: cargo hack test
          run: cargo +stable hack test --workspace --feature-powerset --exclude-features rustc-dep-of-std

  nightly-stuff:
    name: nightly lint, miri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Installs the nightly pinned in rust-toolchain.toml, with its components
      - name: Install pinned nightly toolchain
        run: rustup toolchain install

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --no-default-features -- -D warnings
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo miri test ringbuffer
      - run: cargo miri test short_writer
