
[package]
name = "ruzstd-decompress-fuzz"
version = "0.0.1"
edition = "2024"
authors = ["Automatically generated"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
zstd = "0.5.1"

[dependencies.ruzstd-decompress]
path = ".."
[dependencies.libfuzzer-sys]
git = "https://github.com/rust-fuzz/libfuzzer-sys.git"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"

[[bin]]
name = "decode_dict"
path = "fuzz_targets/decode_dict.rs"

[[bin]]
name = "interop"
path = "fuzz_targets/interop.rs"
